name: Send4 Tecnologia
description: 'Send4 Tecnologia (rebranded as After Sale) is a Brazilian post-purchase
  platform for e-commerce, automating product exchanges, returns, and reverse logistics.
  Founded in 2017, it has processed over 6 million reverse-logistics transactions and
  offers intelligent authorization rules for approvals and blocks, a self-service customer
  exchange portal, real-time returns dashboards, revenue-retention offers (vouchers
  and cashback), integrated shipping labels and tracking, automated refunds and store
  credit, and multi-channel WhatsApp and email support. It advertises a simple, flexible
  API to connect with any e-commerce platform in minutes, though no public developer
  documentation is currently published. After Sale is now part of the Confi ecosystem
  alongside Neotrust and the Confi consumer app.'
